name: 发版（打四端安装包）

# 打 tag（v*）时自动跑：三个系统各打各的桌面版，再补上手机端的包，
# 最后一起挂到 GitHub Release 上。
#
# 为什么必须三个系统各跑一台：PyInstaller **不能交叉编译** ——
# 在 macOS 上打不出 Windows 的 exe，反过来也一样。

env:
  # Windows 控制台默认不是 UTF-8，脚本里 print 中文会 UnicodeEncodeError
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（例如 v1.0.0）"
        required: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            asset: pm-modkit-Windows-x64.zip
          - os: macos-14
            label: macOS arm64
            asset: pm-modkit-macOS-arm64.zip
          - os: ubuntu-22.04
            label: Linux x64
            asset: pm-modkit-Linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Linux 图形库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libx11-6 libxrandr2 libxinerama1 libxcursor1 \
            libxi6 libxext6 libfontconfig1 libegl1 fonts-noto-cjk xvfb zip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: python build/build_app.py --keep-build

      - name: 冒烟测试（Linux，无头跑几帧）
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python - <<'PY'
          import os, subprocess, sys
          os.environ["PM_MODKIT_AUTOTEST"] = "6"
          r = subprocess.run([sys.executable, "app/main.py"], timeout=180)
          raise SystemExit(r.returncode)
          PY

      - name: 冒烟测试（打包后的网页版接口）
        shell: bash
        run: |
          set -e
          BIN="dist/口蘑Mod工坊/口蘑Mod工坊"
          [ -x "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --web --port 8799 &
          SRV=$!
          for i in $(seq 1 40); do
            sleep 2
            if curl -sf -o /dev/null "http://127.0.0.1:8799/manifest.webmanifest"; then break; fi
          done
          curl -sf -o /dev/null "http://127.0.0.1:8799/"
          curl -sf -o /dev/null "http://127.0.0.1:8799/manifest.webmanifest"
          curl -sf -o /dev/null "http://127.0.0.1:8799/sw.js"
          echo "打包后的产物能起服务 ✓"
          kill $SRV || true

      - name: 压成 zip
        if: runner.os != 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          # 用 Python 打包而不是 zip 命令（GitHub 的 Windows runner 没装 zip）。
          # 路径别拼成 dist/dist/xxx —— 上次就是这么打了个 22 字节的空包。
          python - <<'PY'
          import os, zipfile, pathlib
          dist = pathlib.Path('dist')
          app = dist / '\u53e3\u8611Mod\u5de5\u574a.app'
          folder = dist / '\u53e3\u8611Mod\u5de5\u574a'
          target = app if app.is_dir() else folder
          assert target.is_dir(), f'no build output: {target}'
          out = dist / os.environ['ASSET']
          out.unlink(missing_ok=True)
          n = 0
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in sorted(target.rglob('*')):
                  if not f.is_file():
                      continue
                  zi = zipfile.ZipInfo(str(f.relative_to(dist)).replace(os.sep, '/'),
                                       date_time=(2026, 1, 1, 0, 0, 0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.flag_bits |= 0x800
                  zi.external_attr = (0o755 if os.access(f, os.X_OK) else 0o644) << 16
                  z.writestr(zi, f.read_bytes())
                  n += 1
          print(f'  {out.name}: {n} files, {out.stat().st_size/1048576:.1f} MB')
          PY

      - name: 压成 tar.gz（Linux 保留可执行位）
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/${{ matrix.asset }}" 口蘑Mod工坊

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  mobile:
    name: 手机端（Android / iOS）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 打手机端包
        run: |
          python tools/package_mobile.py -o dist
          cd dist
          mv "口蘑Mod工坊-Android.zip" "pm-modkit-Android.zip"
          mv "口蘑Mod工坊-iOS.zip"     "pm-modkit-iOS.zip"
          ls -la pm-modkit-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: dist/pm-modkit-*.zip
          if-no-files-found: error

  release:
    name: 挂到 Release
    needs: [desktop, mobile]
    runs-on: ubuntu-22.04
    steps:
      # gh release create 要在 git 仓库里跑，这个 job 没 checkout 过
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 列一下都收到什么（顺便挡住空文件）
        run: |
          ls -la assets
          for f in assets/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -lt 100000 ]; then echo "::error::$f 是空的 ($sz 字节)"; exit 1; fi
          done

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'MD'
          ## 四个设备的安装包

          | 下载 | 怎么装 |
          |---|---|
          | **口蘑Mod工坊-macOS.zip** | 解压，把 `口蘑Mod工坊.app` 拖进「应用程序」。首次打开被 Gatekeeper 拦就右键 → 打开 |
          | **口蘑Mod工坊-Windows.zip** | 解压，双击 `口蘑Mod工坊.exe`。免安装，整个文件夹一起拷走即可 |
          | **口蘑Mod工坊-Android.zip** | 用 Termux，照包里的「安卓安装说明.md」走；装完可以「添加到主屏幕」当 App |
          | **口蘑Mod工坊-iOS.zip** | 在电脑上双击「启动服务.command / .bat」，iPhone 用 Safari 连过去，再「添加到主屏幕」 |

          > 手机端走的是**网页版**：这个工具的核心是 Python + UnityPy，解包要用
          > `lz4` / `brotli` / `texture2ddecoder` / `astc_encoder` / `etcpak` / `fmod_toolkit`
          > 这些原生扩展，它们没有 Android / iOS 轮子。所以 Android 把后端装在 Termux 里，
          > iOS 把后端放在电脑上、手机当终端。**四端功能一致**，只有「重打包 APK」
          > 需要 JDK + Android build-tools，手机上做不了（会自动退到 UnityCache / .pmmod 路线）。

          **首次打开 macOS 版被拦**：`xattr -dr com.apple.quarantine 口蘑Mod工坊.app`
          MD
          gh release create "$TAG" assets/* \
            --title "口蘑 Mod 工坊 $TAG" \
            --notes-file notes.md \
            --verify-tag 2>/dev/null || \
          gh release create "$TAG" assets/* \
            --title "口蘑 Mod 工坊 $TAG" \
            --notes-file notes.md
